name: Refresh data

# Rafraîchit l'annuaire sur le VPS : import SIRENE, enrichissement d'un lot de fiches,
# puis contrôle croisé sur les annuaires tiers.
on:
  schedule:
    - cron: "17 3 * * 1" # chaque lundi à 03:17 UTC
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre de fiches à enrichir"
        required: true
        default: "500"
      verifier:
        description: "Nombre de fiches à contrôler sur les annuaires tiers (0 = aucune)"
        required: true
        default: "100"

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Import et enrichissement
    runs-on: ubuntu-latest
    # Activé une fois le serveur préparé : variable de dépôt DEPLOY_ENABLED = true
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Run worker via SSH
        uses: appleboy/ssh-action@v1
        env:
          LIMITE: ${{ inputs.limite || '500' }}
          VERIFIER: ${{ inputs.verifier || '100' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LIMITE,VERIFIER
          command_timeout: 120m
          script: |
            set -e
            cd /var/www/artisans/app
            for n in "$LIMITE" "$VERIFIER"; do
              case "$n" in ''|*[!0-9]*) echo "nombre invalide : $n"; exit 1;; esac
            done
            docker compose run --rm worker npm run ingest
            docker compose run --rm worker npm run enrich -- --limite="$LIMITE"
            if [ "$VERIFIER" -gt 0 ]; then
              docker compose run --rm worker npm run verify -- --limite="$VERIFIER"
            fi
