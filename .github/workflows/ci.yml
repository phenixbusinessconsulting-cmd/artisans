name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build

  deploy-production:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [checks]
    # Activé une fois le serveur préparé : variable de dépôt DEPLOY_ENABLED = true
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/artisans
            git pull origin main
            export GIT_COMMIT_HASH=$(git rev-parse --short HEAD)
            docker compose build app worker
            docker compose up -d app
            sleep 5
            if ! docker compose ps --status running --services | grep -qx app; then
              echo "Le conteneur app n'est pas en cours d'exécution après le démarrage"
              docker compose ps -a
              docker compose logs --tail 50 app
              exit 1
            fi
            docker image prune -f --filter "until=24h"
            echo "Déploiement terminé : $(date) (commit: $GIT_COMMIT_HASH)"
